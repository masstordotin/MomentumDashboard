name: Refresh Portfolio Prices & Sectors

# Keeps the Portfolio tab's Sector and Current Price columns up to date for
# stocks that aren't in that day's momentum-picks.json screen (which only
# covers ~15 names). Runs entirely on GitHub's free infrastructure - no
# external accounts, no API keys, no secrets beyond the built-in token.

on:
  schedule:
    # Roughly hourly during NSE market hours (9:15am-3:30pm IST = 3:45-10:00 UTC),
    # Monday-Friday. Cron is UTC; 45 3-9 lands on 9:15, 10:15, ... 15:15 IST.
    - cron: '45 3-9 * * 1-5'
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh NSE sector lookup
        # continue-on-error because NSE's archives site occasionally blocks
        # requests from cloud/datacenter IPs (including CI runners). If it
        # fails, prices still get refreshed below.
        run: python refresh_nse_sectors.py
        continue-on-error: true

      - name: Refresh portfolio prices
        run: python refresh_portfolio_prices.py

      - name: Commit changes if any
        run: |
          git config user.name "portfolio-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nse-sectors.json portfolio-prices.json
          git diff --cached --quiet || git commit -m "Auto-refresh portfolio prices/sectors ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
